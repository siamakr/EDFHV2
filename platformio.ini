; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_port = /dev/tty.usbmodem141859801
lib_deps = tomstewart89/BasicLinearAlgebra@^3.7

; src/ is split by subsystem, and a quoted #include only searches the
; including file's own directory. Without these, Actuator/RCSActuator.h
; could not find Actuator.h and main.cpp could not find any of them.
; include/ is already on the path by default, which is where consts.h lives.
; The teensy platform defaults to gnu++14, but this codebase uses std::clamp
; and constexpr-heavy config, so it needs 17.
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -I src/Actuator
    -I src/Controller
    -I src/Sensor

